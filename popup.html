<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --font-color: #000000;
      --border-color: #b3b3b3;
      --accent-color: #ff9900;
      --accent-hover: #e68a00;
      --bg-color: #ffffff;
    }

    body { 
      min-width: 350px; 
      margin: 0;
      padding: 15px; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--font-color);
    }
    h3 { margin-top: 1rem; margin-bottom: 15px; color: var(--font-color); }
    
    .controls { 
      margin-bottom: 0; 
      padding-bottom: 8px; 
      border-bottom: 1px solid var(--border-color); 
    }
    
    .toggle-group { 
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 6px 10px;
      font-size: 0.9em; 
    }

    .search-box {
      display: flex;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .search-box:focus-within {
      border-color: black;
      box-shadow: 0 0 3px var(--border-color);
    }
    input#cardName { 
      flex: 1;
      padding: 8px; 
      background-color: var(--bg-color); 
      border: none; 
      color: var(--font-color);
      outline: none;
    }
    button#searchBtn { 
      padding: 6px 12px; 
      margin: 4px;
      cursor: pointer; 
      background-color: var(--accent-color); 
      border: none; 
      border-radius: 2px;
      color: #ffffff; 
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button#searchBtn:hover { background-color: var(--accent-hover); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9em;
    }
    th {
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 4px;
      color: var(--font-color);
    }
    td {
      padding: 10px 4px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    
    th:last-child, td:last-child {
      text-align: right;
    }
    
    .price-cell { font-weight: bold; color: var(--font-color); }
    .vendor-cell { color: var(--font-color); }
    .set-cell { color: var(--font-color); }
    .status-in { color: #16a34a; font-weight: 500; }
    .status-out { color: #dc2626; font-weight: 500; }

    .buy-btn {
      background-color: var(--accent-color);
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 3px;
      font-weight: bold;
      text-decoration: none;
      font-size: 1em;
      display: inline-block;
      transition: background-color 0.2s;
    }
    .buy-btn:hover {
      background-color: var(--accent-hover);
      text-decoration: none;
    }

    a { color: var(--accent-color); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #cccccc;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--accent-color);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <h3>Price Checker</h3>
  
  <div class="controls">
    <div class="search-box">
      <input type="text" id="cardName" placeholder="Smothering Tithe">
      <button id="searchBtn">Search</button>
    </div>
    
    <div>
      <div class="toggle-group">
        <label for="toggleCheapestVendor">Show Cheapest Vendor Only</label>
        <label class="switch">
          <input type="checkbox" id="toggleCheapestVendor">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-group">
        <label for="toggleCheapestVersion">Show Cheapest Print Only</label>
        <label class="switch">
          <input type="checkbox" id="toggleCheapestVersion">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-group">
        <label for="toggleInStock">Show In Stock Only</label>
        <label class="switch">
          <input type="checkbox" id="toggleInStock" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div id="results"></div>
  
  <div id="debug" style="display: flex; margin-top: 20px; padding-top: 10px; border-top: 1px dashed #666; font-size: 0.7em; color: #888;">
    <strong>Raw Titles (Debug):</strong>
    <div id="rawTitles"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
