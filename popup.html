<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 350px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .controls { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
    .toggle-group { margin-bottom: 8px; font-size: 0.9em; }
    .card-item { margin-bottom: 10px; padding: 8px; border: 1px solid #eee; border-radius: 4px; }
    .vendor-tag { font-size: 0.75em; background: #f0f0f0; padding: 2px 5px; border-radius: 3px; color: #555; }
    .price { font-weight: bold; color: #2c3e50; }
    input { width: 70%; padding: 5px; }
    button#searchBtn { width: 25%; padding: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>TCG Price Tracker</h3>
  
  <div class="controls">
    <input type="text" id="cardName" placeholder="Search card...">
    <button id="searchBtn">Search</button>
    <div style="margin-top: 10px;">
      <div class="toggle-group">
        <input type="checkbox" id="toggleCollapse"> <label for="toggleCollapse">Collapse by Card Version</label>
      </div>
      <div class="toggle-group">
        <input type="checkbox" id="toggleLowest"> <label for="toggleLowest">Lowest Price Only</label>
      </div>
    </div>
  </div>

  <div id="results"></div>
  <script src="popup.js"></script>
</body>
</html>
